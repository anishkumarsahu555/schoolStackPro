services:
  web:
    secrets:
      - vapid_private_key
    environment:
      VAPID_PRIVATE_KEY: /run/secrets/vapid_private_key
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set the matching VAPID public key}

secrets:
  vapid_private_key:
    file: ${VAPID_KEY_FILE:?Set the absolute host path to private_key.pem}
